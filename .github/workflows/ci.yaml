name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: realworld-frontend
  AWS_REGION: us-east-1
  ECR_PUSH_ROLE_ARN: arn:aws:iam::973122996566:role/realworld-bootstrap-gha-ecr-push
  PLATFORM_REPO: realworld-platform
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright/python:v1.64.1-noble
  PLAYWRIGHT_VERSION: "1.64.1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn generate
      - run: npx eslint src --ext ts,tsx --report-unused-disable-directives

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn generate
      - name: Unit tests
        run: npx jest --coverage
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Pipeline script tests
        run: |
          pip install pytest
          python -m pytest -q -p no:cacheprovider .github/e2e .github/perf

  build:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      api_url: ${{ steps.meta.outputs.api_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # API_URL is baked into the bundle, so the image is built for the environment
      # the branch deploys to: main (and pull requests into it) -> prod, dev -> dev.
      - id: meta
        env:
          TARGET: ${{ github.base_ref || github.ref_name }}
        run: |
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          if [ "$TARGET" = dev ]; then
            echo "api_url=https://dev.interview.gusnikola.com/api" >> "$GITHUB_OUTPUT"
          else
            echo "api_url=https://interview.gusnikola.com/api" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          build-args: API_URL=${{ steps.meta.outputs.api_url }}
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  scan:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}
      - name: Report HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy.txt
          exit-code: "0"
      - name: Add report to the job summary
        if: always()
        run: |
          { echo '### Trivy (HIGH, CRITICAL with a fix)'; echo '```'; cat trivy.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Report only: fixable CRITICAL findings mark this step as failed and leave an
      # annotation on the run, but do not block the deploy.
      - name: Flag fixable CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          input: ${{ runner.temp }}/image.tar
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

  e2e:
    needs: build
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.build.outputs.tag }}
      API_URL: ${{ needs.build.outputs.api_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}
      - run: docker load -i "$RUNNER_TEMP/image.tar"
      - name: Browser smoke test
        run: |
          docker network create e2e
          docker run -d --name e2e-frontend --network e2e "$IMAGE:$TAG"
          docker run --rm --ipc=host --network e2e -v "$PWD/.github/e2e:/e2e:ro" \
            "$PLAYWRIGHT_IMAGE" bash -c \
            "pip install -q --break-system-packages playwright==$PLAYWRIGHT_VERSION && python /e2e/smoke.py http://e2e-frontend $API_URL"
      - name: Frontend logs
        if: failure()
        run: docker logs e2e-frontend

  perf:
    needs: build
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}
      - run: docker load -i "$RUNNER_TEMP/image.tar"
      # Baseline: the target branch for a pull request, the previous head for a push.
      - id: base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          sha=$([ "$EVENT" = pull_request ] && echo "$PR_BASE" || echo "$BEFORE")
          [ "$sha" = 0000000000000000000000000000000000000000 ] && sha=""
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: base_checkout
        if: steps.base.outputs.sha != ''
        continue-on-error: true
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: baseline
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: base_build
        if: steps.base_checkout.outcome == 'success'
        continue-on-error: true
        with:
          context: baseline
          platforms: linux/amd64
          provenance: false
          load: true
          build-args: API_URL=${{ needs.build.outputs.api_url }}
          tags: ${{ env.IMAGE }}:baseline
          cache-from: type=gha,scope=frontend
      - name: Measure bundles
        env:
          HAS_BASELINE: ${{ steps.base_build.outcome == 'success' }}
        run: |
          out="$RUNNER_TEMP/perf" && mkdir -p "$out"
          measure() {
            id=$(docker create "$2")
            docker cp "$id:/usr/share/nginx/html" "$out/$1-build"
            docker rm "$id" >/dev/null
            python3 .github/perf/bundle_size.py measure "$out/$1-build" "$out/$1.json"
          }
          if [ "$HAS_BASELINE" = true ]; then measure baseline "$IMAGE:baseline"; fi
          measure candidate "$IMAGE:$TAG"
      - name: Compare with baseline
        run: python3 .github/perf/bundle_size.py compare "$RUNNER_TEMP/perf/baseline.json" "$RUNNER_TEMP/perf/candidate.json" | tee -a "$GITHUB_STEP_SUMMARY"

  push-image:
    needs: [lint, test, build, scan, e2e, perf]
    # Deploys only from pushes; dev stays off until the dev environment exists.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       (github.ref == 'refs/heads/dev' && vars.DEV_DEPLOY_ENABLED == 'true'))
    runs-on: ubuntu-24.04
    # No GitHub environment here: it would change the OIDC subject, and the ECR push
    # role trusts repository branches.
    permissions:
      contents: read
      id-token: write
    outputs:
      env: ${{ steps.target.outputs.env }}
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - id: target
        run: echo "env=$([ "$GITHUB_REF_NAME" = main ] && echo prod || echo dev)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}
      - run: docker load -i "$RUNNER_TEMP/image.tar"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        id: ecr
      - name: Push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TARGET_ENV: ${{ steps.target.outputs.env }}
        run: |
          repo="realworld-$TARGET_ENV-frontend"
          # Tags are immutable in ECR; a re-run of the same commit skips the push.
          if aws ecr describe-images --repository-name "$repo" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "$repo:$TAG already exists"
            exit 0
          fi
          docker tag "$IMAGE:$TAG" "$REGISTRY/$repo:$TAG"
          docker push "$REGISTRY/$repo:$TAG"

  update-gitops:
    needs: [build, push-image]
    runs-on: ubuntu-24.04
    environment: ${{ needs.push-image.outputs.env }}
    concurrency:
      group: gitops-${{ needs.push-image.outputs.env }}
      cancel-in-progress: false
    env:
      TAG: ${{ needs.build.outputs.tag }}
      TARGET_ENV: ${{ needs.push-image.outputs.env }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.PLATFORM_REPO }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ env.PLATFORM_REPO }}
          ref: main
          token: ${{ steps.app.outputs.token }}
          path: platform
      - name: Commit the new image tag
        working-directory: platform
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          bot="${APP_SLUG}[bot]"
          bot_id=$(gh api "/users/$bot" --jq .id)
          git config user.name "$bot"
          git config user.email "$bot_id+$bot@users.noreply.github.com"

          file="gitops/realworld/values-$TARGET_ENV.yaml"
          # Retries cover a concurrent backend deploy pushing to the same branch.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            yq -i ".frontend.image.tag = \"$TAG\"" "$file"
            if git diff --quiet; then
              echo "frontend $TAG is already deployed to $TARGET_ENV"
              exit 0
            fi
            git commit -q -am "Deploy frontend $TAG to $TARGET_ENV" \
              -m "Source: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
            git push -q origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          echo "could not push the tag update" >&2
          exit 1
